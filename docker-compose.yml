services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifepilot
    ports:
      - "5433:5432"
    volumes:
      - lifepilot-data:/var/lib/postgresql/data
      - ./apps/api/prisma/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifepilot"]
      interval: 5s
      retries: 10

volumes:
  lifepilot-data:
